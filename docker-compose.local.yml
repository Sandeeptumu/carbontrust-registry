# Local development email delivery. Messages stay on this computer, not in Gmail.
# Start with: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
  backend:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_TLS: "false"
      APP_URL: http://localhost:3000
      SECURE_COOKIES: "false"
    depends_on:
      mailpit:
        condition: service_started
