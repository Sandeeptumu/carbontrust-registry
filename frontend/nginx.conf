log_format registry '$remote_addr $request_method $uri $status';
server {
    listen 80;
    access_log /var/log/nginx/access.log registry;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    # Host TLS ingress is the only published listener (127.0.0.1:3000).
    # It must overwrite X-Forwarded-For; adjust this trust range to the deployment network.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location ~ ^/(users|admin|projects|ngo|verifier|buyer|marketplace|mrv)(/|$) {
        # Browser navigations are SPA routes; API fetches accept JSON, uploads and downloads use /mrv or /projects.
        if ($http_accept ~* "text/html") { rewrite ^ /index.html last; }
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; }
}
