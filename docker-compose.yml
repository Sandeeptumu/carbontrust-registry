services:

  mysql:
    image: mysql:8.0
    container_name: carbontrust-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: carbontrust
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-carbontrust-db-password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-carbontrust-db-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: carbontrust-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: carbontrust
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-carbontrust-db-password}
      JWT_SECRET: ${JWT_SECRET:-carbontrust-super-secret-key-for-jwt-2026}
      JWT_EXPIRATION: 3600000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: carbontrust-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
